name: badges
description: Hlídá TeamSpeak badges - každou novou ohlásí (do kanálu, nebo soukromě vybraným lidem), i s kódem, jakmile je známý.
version: 2.0.0
when:
  cron: "*/15 * * * *"
  join: true                      # kdo z notify se připojí, dostane hned, co na něj čeká
may:
  fetch: [badges-content.teamspeak.com, community.teamspeak.com]
  tools: [say_channel, list_online, message_user]
settings:
  notify:
    type: people
    description: komu psát soukromě místo do kanálu ("me" = ty, jméno admina, nebo UID) - kdo není online, dostane to, až přijde
