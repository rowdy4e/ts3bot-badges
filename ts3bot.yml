name: badges
description: Watches TeamSpeak badges - each new one goes privately to whoever subscribed (!badges subscribe), or else to the channel, with its code once it's known.
version: 2.4.0
when:
  cron: "*/15 * * * *"
  join: true                      # a subscriber who connects gets right away what waits for them
  command: badges                 # !badges subscribe | unsubscribe | latest | forget | help - for everyone: !service public badges on
may:
  fetch: [badges-content.teamspeak.com, community.teamspeak.com]
  tools: [say_channel, list_online, message_user]
settings:
  notify:
    type: people
    description: who always gets them, without subscribing ("me" = you, an admin's name, or a UID) - whoever types !badges unsubscribe gets nothing
